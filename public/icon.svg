<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ToffeeOS">
  <!-- The header's brand mark: a "T" on ink. Drawn as shapes, not text, so it looks the same
       everywhere — a font-based "T" renders differently (or not at all) per device. -->
  <rect width="512" height="512" rx="112" fill="#181626"/>
  <rect x="132" y="124" width="248" height="68" rx="10" fill="#faf9fd"/>
  <rect x="222" y="124" width="68" height="264" rx="10" fill="#faf9fd"/>
</svg>
